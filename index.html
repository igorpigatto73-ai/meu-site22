<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        header {
            padding: 50px;
            font-size: 30px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #00ffcc;
            color: black;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<header>
    🚀 Meu Primeiro Site
</header>

<p>Site criado por você 🔥</p>

<button onclick="clicou()">Clique aqui</button>

<script>
    function clicou() {
        alert("Você clicou 😎");
    }
</script>

</body>
</html>
